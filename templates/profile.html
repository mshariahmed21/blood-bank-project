<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ملفي الشخصي | قطرة حياة</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main class="container feature-page"><a class="back-link" href="{{ url_for('index') }}">← الرئيسية</a><section class="content-panel feature-card"><span class="eyebrow">حسابك</span><h1>ملفي الشخصي</h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash {{ c }}">{{ m }}</div>{% endfor %}{% endwith %}<form method="post" class="feature-form"><label>الاسم الكامل<input name="full_name" required maxlength="100" value="{{ donor.full_name }}"></label><label>العمر<input name="age" type="number" min="18" max="100" required value="{{ donor.age }}"></label><label>فصيلة الدم<select name="blood_type" required>{% for b in blood_types %}<option {% if donor.blood_type==b %}selected{% endif %}>{{ b }}</option>{% endfor %}</select></label><label>المدينة<select name="city" required>{% for c in cities %}<option {% if donor.city==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></label><label>رقم الجوال (اختياري)<input name="phone" inputmode="tel" value="{{ donor.phone or '' }}" placeholder="05xxxxxxxx"></label><label class="setting-row"><span><b>إظهار رقمك بموافقتك</b><small>لن يظهر الرقم إذا لم تفعّل هذا الخيار.</small></span><input type="checkbox" name="public_phone" value="yes" {% if donor.public_phone %}checked{% endif %}></label><button class="search-button" type="submit">حفظ التعديلات</button></form></section></main><script src="{{ url_for('static',filename='theme.js') }}"></script></body></html>

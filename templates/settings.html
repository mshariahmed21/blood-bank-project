<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإعدادات | قطرة حياة</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><main class="container feature-page"><a class="back-link" href="{{ url_for('index') }}">← الرئيسية</a><section class="content-panel feature-card"><span class="eyebrow">تحكم بتجربتك</span><h1>الإعدادات</h1><p>إدارة التنبيهات والخصوصية لهذا الحساب.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="flash {{ c }}">{{ m }}</div>{% endfor %}{% endwith %}<form method="post" class="settings-form"><label class="setting-row"><span><b>تنبيهات داخل الموقع</b><small>إظهار تنبيه عند وصول رسالة جديدة أثناء تصفحك.</small></span><input type="checkbox" name="in_site_notifications" value="yes" {% if prefs.in_site_notifications %}checked{% endif %}></label><label class="setting-row"><span><b>إشعارات المتصفح</b><small>السماح بطلب إشعارات النظام عند تفعيلها من صفحة الرسائل.</small></span><input type="checkbox" name="browser_notifications" value="yes" {% if prefs.browser_notifications %}checked{% endif %}></label><label class="setting-row"><span><b>تنبيهات البريد الإلكتروني</b><small>تفضيل محفوظ؛ الإرسال يحتاج إعداد خدمة بريد موثوقة.</small></span><input type="checkbox" name="email_notifications" value="yes" {% if prefs.email_notifications %}checked{% endif %}></label><label class="setting-row"><span><b>الظهور في دليل المتبرعين</b><small>إيقافه يخفي بطاقة بياناتك من الدليل العام.</small></span><input type="checkbox" name="show_in_directory" value="yes" {% if prefs.show_in_directory %}checked{% endif %}></label><button class="search-button" type="submit">حفظ الإعدادات</button></form><p class="privacy-hint">رقم الجوال لا يظهر إلا عند موافقتك. لا تشارك بياناتك الطبية الحساسة في الرسائل العامة.</p></section></main><script src="{{ url_for('static',filename='theme.js') }}"></script></body></html>
